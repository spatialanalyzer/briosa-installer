name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Briosa.Installer.slnx --locked-mode
      - name: Build
        run: dotnet build Briosa.Installer.slnx -c Release --no-restore
      - name: Test core and CLI
        run: dotnet test tests/Briosa.Installer.Tests -c Release --no-build --no-restore
      - name: Exercise WPF source settings
        run: dotnet run --project tests/Briosa.Installer.App.Smoke -c Release --no-build --no-restore
