name: Verify Azure signing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Create inert signing probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/signing-smoke -Force | Out-Null
          [IO.File]::WriteAllText("$PWD/artifacts/signing-smoke/Briosa.SigningProbe.ps1", "Write-Output 'Briosa signing probe. No product functionality.'`r`n", [Text.UTF8Encoding]::new($true))
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}/artifacts/signing-smoke
          files-folder-filter: ps1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          cache-dependencies: false
      - name: Verify Windows publisher and timestamp
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature artifacts/signing-smoke/Briosa.SigningProbe.ps1
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or $signature.SignerCertificate.GetNameInfo('SimpleName', $false) -cne 'David Lucas') { throw 'Authenticode validation failed.' }
          "Verified installer GitHub OIDC and timestamped Authenticode." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: signing-verification-only
          path: artifacts/signing-smoke/*
          retention-days: 7
