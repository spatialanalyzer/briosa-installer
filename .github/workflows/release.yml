name: Release signed installer
# Dispatch on main to sign reviewed code. The publish job creates a draft release; the
# maintainer publishes it, which creates the v<version> tag. Any other branch is an
# unsigned dry run, and tag refs are rejected.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer semantic version without v
        required: true
        type: string
      publish:
        description: Create a draft GitHub Release from this signed main build; publishing the draft creates the tag
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.value }}
      eligible: ${{ steps.version.outputs.eligible }}
    steps:
      # Full history includes tags, so an existing v<version> tag is checked.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: ./eng/Resolve-InstallerRelease.ps1 -Ref $env:GITHUB_REF -Commit $env:GITHUB_SHA -Version $env:DISPATCH_VERSION
      - name: Require Briosa support pins reachable from Briosa main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./eng/Test-BriosaSupportPins.ps1
      # Briosa v0.9.2. Since the previous signing pin c19f64d (spatialanalyzer/briosa#174), the signing paths
      # only SHA-pin setup-dotnet v6.0.0, require SDK 10.0.401, and accept schema 3 server manifests.
      # Installer manifest handling is unchanged.
      - name: Check out reviewed shared signing tools and public trust root
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spatialanalyzer/briosa
          ref: c72e02753fe7c6a0a9830282de9f9a5cff9e8c39
          path: .support/briosa
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore, build, and test
        shell: pwsh
        run: |
          dotnet restore Briosa.Installer.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build Briosa.Installer.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          dotnet test tests/Briosa.Installer.Tests -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet run --project tests/Briosa.Installer.App.Smoke -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'WPF smoke failed.' }
      - name: Build and verify complete offline distribution
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./eng/Publish-Installer.ps1 -Version $env:PACKAGE_VERSION -OutputDirectory "$PWD/artifacts/unsigned" -PublicSettingsFile "$PWD/.support/briosa/eng/signing/public-source.json"
          ./eng/Test-InstallerPackage.ps1 -PackageDirectory "$PWD/artifacts/unsigned/briosa-installer-$env:PACKAGE_VERSION-win-x64" -BriosaRepository "$PWD/.support/briosa"
      # Catalog tools must be the Briosa revision that built the newest eng/server-package-candidates.json release.
      - name: Check out the Briosa revision that built the newest server package candidates
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spatialanalyzer/briosa
          ref: c72e02753fe7c6a0a9830282de9f9a5cff9e8c39
          path: .support/briosa-candidates
          persist-credentials: false
          sparse-checkout: |
            eng
            schemas
      - name: Validate real server packages for both SA targets and every approved major with the packaged CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.value }}
        run: ./eng/Test-ServerPackageCandidates.ps1 -BriosaRepository "$PWD/.support/briosa-candidates" -ArtifactDirectory "$PWD/artifacts/server-candidates" -CliPath "$PWD/artifacts/unsigned/briosa-installer-$env:PACKAGE_VERSION-win-x64/Briosa.Installer.Cli.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installer
          path: |
            artifacts/unsigned/*.zip
            artifacts/unsigned/*.sha256
            artifacts/unsigned/*.provenance.json
          if-no-files-found: error
  sign:
    needs: package
    if: github.ref == 'refs/heads/main' && needs.package.outputs.eligible == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Same reviewed signing-tool pin as the package job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: spatialanalyzer/briosa
          ref: c72e02753fe7c6a0a9830282de9f9a5cff9e8c39
          path: .support/briosa
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: unsigned-installer
          path: artifacts/unsigned
      # Artifact Signing installs its .NET tool from this repository, under its
      # strict global.json. The pinned sign-package action provisions the SDK from
      # the Briosa pin's global.json (10.0.401 at c72e027), so this step provisions
      # the Installer's own pin and keeps Installer SDK updates independent of it.
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Sign the installer, CLI, launcher, and shortcut script
        id: sign
        uses: ./.support/briosa/.github/actions/sign-package
        with:
          package-path: artifacts/unsigned/briosa-installer-${{ needs.package.outputs.version }}-win-x64.zip
          staging-directory: artifacts/signing
          output-directory: artifacts/signed
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify final archive and packaged entry points
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $name = "briosa-installer-$env:PACKAGE_VERSION-win-x64"
          ./.support/briosa/eng/Prepare-SignedPackage.ps1 -PackagePath "artifacts/signed/$name.zip" -OutputDirectory artifacts/final-verification
          Import-Module ./.support/briosa/eng/ReleasePackageSigning.psm1
          Assert-ReleaseSignatures "artifacts/final-verification/$name" 'David Lucas'
          & "./artifacts/final-verification/$name/Briosa.Installer.Cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Signed CLI failed.' }
          $launcher = Start-Process -FilePath "./artifacts/final-verification/$name/Briosa.Launcher.exe" -ArgumentList '--check' -WindowStyle Hidden -Wait -PassThru
          if ($launcher.ExitCode -ne 0) { throw 'Signed launcher failed.' }
          ./eng/Test-InstallerPackage.ps1 -PackageDirectory "artifacts/final-verification/$name" -PackageArchive "artifacts/signed/$name.zip" -BriosaRepository "$PWD/.support/briosa"
      - name: Install pinned setup compiler
        shell: pwsh
        run: ./eng/Install-SetupCompiler.ps1
      - name: Prepare the uninstaller for signing
        id: setup
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $uninstaller = ./eng/Build-Setup.ps1 -PackageDirectory "artifacts/final-verification/briosa-installer-$env:PACKAGE_VERSION-win-x64" -OutputDirectory artifacts/setup -Mode prepare-signing
          ./eng/Write-SigningFileList.ps1 -FilePath $uninstaller -OutputPath artifacts/uninstaller-signing.txt
          $config = Get-Content .support/briosa/eng/signing/azure.json -Raw | ConvertFrom-Json
          "endpoint=$($config.endpoint)" >> $env:GITHUB_OUTPUT
          "account=$($config.account)" >> $env:GITHUB_OUTPUT
          "profile=$($config.certificateProfile)" >> $env:GITHUB_OUTPUT
      - name: Sign the uninstaller
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ steps.setup.outputs.endpoint }}
          signing-account-name: ${{ steps.setup.outputs.account }}
          certificate-profile-name: ${{ steps.setup.outputs.profile }}
          files-catalog: artifacts/uninstaller-signing.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Briosa Installer
          description-url: https://briosa.dev
          exclude-environment-credential: true
          cache-dependencies: false
      - name: Compile setup with the signed uninstaller
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $setup = ./eng/Build-Setup.ps1 -PackageDirectory "artifacts/final-verification/briosa-installer-$env:PACKAGE_VERSION-win-x64" -OutputDirectory artifacts/setup -Mode signed
          ./eng/Write-SigningFileList.ps1 -FilePath $setup -OutputPath artifacts/setup-signing.txt
      - name: Sign the setup executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ steps.setup.outputs.endpoint }}
          signing-account-name: ${{ steps.setup.outputs.account }}
          certificate-profile-name: ${{ steps.setup.outputs.profile }}
          files-catalog: artifacts/setup-signing.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Briosa Installer Setup
          description-url: https://briosa.dev/install
          exclude-environment-credential: true
          cache-dependencies: false
      - name: Test signed setup and finalize release files
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $setup = "artifacts/setup/briosa-installer-$env:PACKAGE_VERSION-win-x64-setup.exe"
          ./eng/Test-Setup.ps1 -SetupPath $setup -PackageDirectory "artifacts/final-verification/briosa-installer-$env:PACKAGE_VERSION-win-x64" -RequireSignatures
          ./eng/Complete-Setup.ps1 -SetupPath $setup -OutputDirectory artifacts/signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-installer
          path: artifacts/signed/*
          if-no-files-found: error
  publish:
    if: inputs.publish && needs.package.outputs.eligible == 'true'
    needs: [package, sign]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: signed-installer
          path: artifacts/release
      - name: Create draft release for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          $files = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          if ($files.Count -ne 5) { throw 'Expected signed setup and checksum, plus signed ZIP, checksum, and provenance.' }
          # Drafts are listed only by the releases list endpoint, not by releases/tags/<tag>.
          $existing = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list existing releases.' }
          if ($existing -ccontains $tag) { throw "A release or draft release already uses $tag; review it instead of creating another." }
          # Publishing the draft creates the tag at the signed commit.
          $arguments = @('release', 'create', $tag, '--draft', '--target', $env:GITHUB_SHA, '--generate-notes', '--title', "Briosa Installer $env:PACKAGE_VERSION")
          if ($env:PACKAGE_VERSION.Contains('-')) { $arguments += '--prerelease' }
          $url = gh @arguments @files
          if ($LASTEXITCODE -ne 0) {
            # GitHub refuses this for the workflow token when the commit's workflow files
            # differ from main, for example after a workflow change merged during approval.
            @(
              "## Draft release $tag was refused"
              ''
              "GitHub would not let the workflow token create the draft release for ``$env:GITHUB_SHA``. This happens when that commit's workflow files differ from main, for example after a workflow change merged while this run waited for approval. The signed files are this run's artifacts; nothing was released."
              ''
              'To release this commit as approved, the maintainer:'
              ''
              "1. Pushes the tag at this commit over SSH: ``git push git@github.com:$env:GITHUB_REPOSITORY.git ${env:GITHUB_SHA}:refs/tags/$tag``."
              '2. Uses **Re-run failed jobs** on this run. With the tag in place GitHub creates no tag, so the draft is created with the same signed files.'
              "3. If the draft is still refused, downloads this run's signed files with ``gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name signed-installer``, then creates the draft on the Releases page from the existing tag $tag with those five files."
            ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
            throw "The workflow token could not create the draft release for $tag; see the job summary for the recovery."
          }
          @(
            "Created draft release $tag for commit ${env:GITHUB_SHA}: $url"
            ''
            "The maintainer must review the draft, confirm its target is $env:GITHUB_SHA, and publish it. Publishing creates the $tag tag."
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY
