version: 2
updates:
  # Actions are pinned to commit SHAs, as GitHub's SHA-pinning Actions setting requires.
  # The cooldown waits a week after an action release before proposing it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
