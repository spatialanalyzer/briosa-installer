version: 2
updates:
  # Actions are pinned to commit SHAs, as GitHub's SHA-pinning Actions setting requires.
  # The cooldown waits a week after an action release before proposing it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The SDK pin decides the runtime that the self-contained single-file executables
  # bundle, so .NET servicing releases arrive as global.json update PRs. A new .NET
  # major is a deliberate change, not a routine update.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
